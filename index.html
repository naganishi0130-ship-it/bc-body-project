sm(`<h2>⚙️ 設定</h2><div class="fg"><label>アプリ名</label><input type="text" id="s-name" value="${st.appName}" maxlength="30"></div><h3 style="color:#F39C12;margin:12px 0 6px;font-size:13px">🎯 目標</h3><div class="fg"><label>目標体重 (kg)</label><input type="number" step="0.1" id="s-gw" value="${st.goalWeight}" inputmode="decimal"></div><div class="fg"><label>目標体脂肪率 (%)</label><input type="number" step="0.1" id="s-gb" value="${st.goalBF}" inputmode="decimal"></div><h3 style="color:#F39C12;margin:12px 0 6px;font-size:13px">📊 スタート地点</h3><div class="fg"><label>開始時体重 (kg)</label><input type="number" step="0.1" id="s-sw" value="${st.startWeight}" inputmode="decimal"><div class="help">進捗計算の基準になります</div></div><div class="fg"><label>開始時体脂肪率 (%)</label><input type="number" step="0.1" id="s-sb" value="${st.startBF}" inputmode="decimal"></div><h3 style="color:#F39C12;margin:12px 0 6px;font-size:13px">🔥 現在のPhase</h3><div class="phase-selector">${phaseHTML}</div><div class="tip">Phase切替で食事目標カロリー・マクロが変わります</div><button class="btn suc" onclick="saveSettings()">💾 設定を保存</button><button class="btn sec" onclick="resetMeals()">🍽️ 食事メニューを初期値に戻す</button><button class="btn dan" onclick="resetAllData()">⚠️ 全データ初期化</button><button class="btn sec" onclick="mcx()">閉じる</button>`)}
function selectPhase(p){s.settings.currentPhase=p;document.querySelectorAll('.phase-opt').forEach((el,i)=>{if(i+1===p)el.classList.add('active');else el.classList.remove('active')})}
function saveSettings(){const name=document.getElementById('s-name').value.trim();const gw=parseFloat(document.getElementById('s-gw').value);const gb=parseFloat(document.getElementById('s-gb').value);const sw=parseFloat(document.getElementById('s-sw').value);const sb=parseFloat(document.getElementById('s-sb').value);if(!name){alert('アプリ名は必須です');return}if(isNaN(gw)||isNaN(gb)||isNaN(sw)||isNaN(sb)){alert('数値を入力してください');return}s.settings.appName=name;s.settings.goalWeight=gw;s.settings.goalBF=gb;s.settings.startWeight=sw;s.settings.startBF=sb;ss();updateHeader();mcx();r();sm(`<h2>✅ 保存しました</h2><p>設定が反映されました。</p><button class="btn" onclick="mcx()">OK</button>`)}
function resetMeals(){sm(`<h2>⚠️ 食事メニュー初期化</h2><p>食事メニューをデフォルトに戻しますか?(現在のカスタマイズは失われます)</p><button class="btn dan" onclick="doResetMeals()">初期化</button><button class="btn sec" onclick="mcx()">キャンセル</button>`)}
function doResetMeals(){s.meals=JSON.parse(JSON.stringify(DEFAULT_MEAL));ss();mcx();r()}
function resetAllData(){sm(`<h2>⚠️⚠️ 全データ初期化</h2><p style="color:#E74C3C">全てのデータ(体重記録・トレ履歴・設定・食事メニュー)を削除します。<br><br>本当に実行しますか?</p><button class="btn dan" onclick="doResetAll()">全て削除</button><button class="btn sec" onclick="mcx()">キャンセル</button>`)}
function doResetAll(){localStorage.removeItem('bc');location.reload()}
function el(t){const l=LBL[t],ex=EX[t];sm(`<h2>${l.e} ${l.n} 種目一覧</h2>${ex.map(x=>`<div class="detail-box"><div style="font-weight:700;margin-bottom:3px">${x.n}</div><div style="font-size:10px;color:#F39C12;margin-bottom:3px">🎯 ${x.t}</div><div style="font-size:12px;color:#B3D4F0;margin-bottom:6px">${x.s}</div>${x.how?`<div style="font-size:11px;line-height:1.5;color:#e8e8e8"><strong style="color:#F39C12">📋 やり方:</strong><ol style="padding-left:16px;margin-top:3px">${x.how.map(y=>`<li>${y}</li>`).join('')}</ol></div>`:''}${x.pt?`<div style="font-size:11px;line-height:1.5;color:#e8e8e8;margin-top:6px"><strong style="color:#27AE60">✅ ポイント:</strong><ul style="padding-left:16px;margin-top:3px">${x.pt.map(y=>`<li>${y}</li>`).join('')}</ul></div>`:''}${x.ng?`<div style="font-size:11px;line-height:1.5;color:#e8e8e8;margin-top:6px"><strong style="color:#E74C3C">❌ NG:</strong><ul style="padding-left:16px;margin-top:3px">${x.ng.map(y=>`<li>${y}</li>`).join('')}</ul></div>`:''}</div>`).join('')}<button class="btn" onclick="mcx()">閉じる</button>`)}
function sl(){sm(`<h2>🧘 柔軟性メニュー</h2><h3>🌅 ウォームアップ(動的)</h3>${WU.map(x=>`<div class="detail-box"><div style="font-weight:700">${x.n}</div><div style="font-size:12px;color:#B3D4F0">${x.s}</div>${x.how?`<div style="font-size:11px;line-height:1.5;margin-top:4px"><strong style="color:#F39C12">やり方:</strong><ol style="padding-left:16px">${x.how.map(y=>`<li>${y}</li>`).join('')}</ol></div>`:''}${x.pt?`<div style="font-size:11px;line-height:1.5;margin-top:4px"><strong style="color:#27AE60">ポイント:</strong><ul style="padding-left:16px">${x.pt.map(y=>`<li>${y}</li>`).join('')}</ul></div>`:''}</div>`).join('')}<h3>🌙 マスト5種目(毎日)</h3>${MUST5.map(x=>`<div class="detail-box"><div style="font-weight:700">${x.n}</div><div style="font-size:12px;color:#B3D4F0">${x.s}</div>${x.how?`<div style="font-size:11px;line-height:1.5;margin-top:4px"><strong style="color:#F39C12">やり方:</strong><ol style="padding-left:16px">${x.how.map(y=>`<li>${y}</li>`).join('')}</ol></div>`:''}${x.pt?`<div style="font-size:11px;line-height:1.5;margin-top:4px"><strong style="color:#27AE60">ポイント:</strong><ul style="padding-left:16px">${x.pt.map(y=>`<li>${y}</li>`).join('')}</ul></div>`:''}</div>`).join('')}<button class="btn" onclick="mcx()">閉じる</button>`)}
function r(){updateHeader();if(s.cv==='today')rt();else if(s.cv==='cal')rcal();else if(s.cv==='body')rb();else if(s.cv==='menu')rmv()}
function init(){ls();if(s.w.length===0){s.w.push({date:new Date().toISOString().split('T')[0],weight:s.settings.startWeight,bodyFat:s.settings.startBF,muscleMass:42.7});ss()}r()}
init();
</script>
</body>
</html>
